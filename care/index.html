<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f3ec">
  <meta name="description" content="ДЛЯ СЕБЯ — 40 карточек заботы о себе. Маленькое действие, которое сегодня будет только для тебя.">
  <meta property="og:title" content="ДЛЯ СЕБЯ — 40 карточек заботы о себе">
  <meta property="og:description" content="Не исправляй себя. Выбирай себя.">
  <meta property="og:type" content="website">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>ДЛЯ СЕБЯ — 40 карточек заботы о себе</title>
</head>
<body>
  <a class="skip" href="#main">Перейти к содержимому</a>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" data-action="home" aria-label="На главную">
        <span class="brand-mark">♡</span><span><b>ДЛЯ СЕБЯ</b><small>40 карточек заботы о себе</small></span>
      </button>
      <button class="quiet-button install hidden" id="installBtn">Установить приложение</button>
      <button class="profile-button" data-view="history" aria-label="Моя история"><span>♡</span></button>
    </header>
    <main id="main" tabindex="-1">
      <section id="view" aria-live="polite"></section>
    </main>
    <nav class="bottom-nav" aria-label="Основная навигация">
      <button data-view="home" class="active"><span>⌂</span><small>Сегодня</small></button>
      <button data-view="catalog"><span>▦</span><small>Колода</small></button>
      <button data-view="history"><span>◷</span><small>Мой путь</small></button>
      <button data-view="favorites"><span>♡</span><small>Любимые</small></button>
      <button data-view="aphrodite"><span>✧</span><small>Афродита</small></button>
    </nav>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js" defer></script>
</body>
</html>

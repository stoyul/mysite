  <div class="shell"><aside><p class="eyebrow">МОЕ ПРОСТРАНСТВО</p><nav aria-label="Разделы приложения" id="navigation"></nav><p class="sidebar-note">Я выбираю цель,<br>но радость нахожу<br>уже в самом процессе.</p><a href="https://t.me/stoyul" target="_blank" rel="noopener">Получить консультацию ↗</a></aside>

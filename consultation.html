<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Запись на консультацию — Юлия Стоянова</title>
<meta name="description" content="Запишитесь на консультацию к Юлии Стояновой. Разберем ваш запрос, вернем ясность и определим следующий шаг.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Manrope:wght@300;400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230c0710'/%3E%3Ctext x='32' y='44' fill='%23c9a24a' font-size='34' font-family='Georgia,serif' text-anchor='middle'%3EYS%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="contact">

<section class="page-hero">
  <div class="wrap page-hero-inner">
    <div class="breadcrumb"><a href="index.html" data-i18n="bc.home"></a><span>/</span><span data-i18n="nav.contact"></span></div>
    <span class="eyebrow" data-i18n="nav.contact"></span>
    <h1 data-i18n="cta.book"></h1>
    <p class="lead" data-i18n="page.consult.lead"></p>
  </div>
</section>

<section class="section">
  <div class="wrap">
    <form id="consult-form" class="form-card reveal">
      <div class="field"><label data-i18n="form.name"></label><input type="text" name="name" autocomplete="name" required></div>
      <div class="field"><label data-i18n="form.contact"></label><input type="text" name="contact" required></div>
      <div class="field"><label data-i18n="form.format"></label>
        <select name="format">
          <option data-i18n="form.opt.personal"></option>
          <option data-i18n="form.opt.product"></option>
          <option data-i18n="form.opt.expert"></option>
        </select>
      </div>
      <div class="field"><label data-i18n="form.message"></label><textarea name="message"></textarea></div>
      <p class="form-note" data-i18n="form.note"></p>
      <div style="margin-top:22px"><button type="submit" class="btn btn-magenta btn-lg" data-i18n="form.submit"></button></div>
    </form>
    <div id="consult-success" class="form-success">
      <h3 data-i18n="form.success.h"></h3>
      <p data-i18n="form.success.p"></p>
    </div>
  </div>
</section>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/site.js"></script>
</body>
</html>
